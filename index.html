
<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isabella & Lucas</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Isabella & Lucas</h1>

  <p>
    Criamos essa lista com muito carinho.

<main id="lista"></main>

    <button onclick="confirmar()">

    <button class="secundario" onclick="fechar()">
      Cancelar
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
